<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — 测试机台编排</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-block">
        <h1 class="brand">ATLAS</h1>
        <p class="brand-sub">测试机台编排</p>
      </div>
      <nav class="view-tabs" aria-label="主分区">
        <button type="button" id="nav-machines" class="tab active" data-route="machines">机台</button>
        <button type="button" id="nav-functions" class="tab" data-route="functions">已注册功能</button>
        <button type="button" id="nav-sequences" class="tab" data-route="sequences">序列模板</button>
      </nav>
    </div>
    <button id="refresh-btn" type="button" class="btn-primary">刷新</button>
  </header>

  <main class="page">
    <div id="view-machines" class="view view-active">
      <section id="agents-section">
        <h2 class="view-title">机台</h2>
        <div id="agents-grid" class="agent-grid" aria-live="polite"></div>
        <p id="agents-empty" class="empty" hidden>暂无机台</p>
      </section>
    </div>

    <div id="view-agent-detail" class="view" hidden>
      <section id="agent-detail-section">
        <div class="detail-toolbar">
          <button type="button" id="agent-detail-back" class="btn-sm">返回机台</button>
          <h2 id="agent-detail-name" class="view-title">—</h2>
        </div>
        <div id="agent-detail-status" class="status-rail"></div>
        <div id="agent-detail-actions" class="detail-actions"></div>
      </section>
    </div>

    <div id="view-functions" class="view" hidden>
      <section id="vi-templates-section">
        <h2 class="view-title">已注册功能</h2>
        <p id="vi-templates-msg" class="msg" hidden></p>
        <div class="form-grid vi-agent-row">
          <label for="vi-templates-agent-filter">机台筛选</label>
          <select id="vi-templates-agent-filter">
            <option value="">全部</option>
          </select>
          <label for="vi-templates-source-filter">来源筛选</label>
          <select id="vi-templates-source-filter">
            <option value="">全部</option>
            <option value="labview">VI</option>
            <option value="general">通用</option>
          </select>
        </div>
        <div id="functions-groups" class="functions-groups">
          <section class="function-group" id="functions-vi-group">
            <h3>中心VI功能</h3>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>来源</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>来源机台</th>
                    <th>路径/配置</th>
                    <th>入参</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="vi-templates-body">
                  <tr><td colspan="8" class="empty">暂无已注册 VI 功能</td></tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="function-group" id="functions-general-group">
            <h3>中心通用功能</h3>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>来源</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>来源机台</th>
                    <th>路径/配置</th>
                    <th>入参</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="general-templates-body">
                  <tr><td colspan="8" class="empty">暂无已注册通用功能</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </div>

    <div id="view-sequences" class="view" hidden>
      <section id="sequence-templates-section">
        <h2 class="view-title">序列模板</h2>
        <p id="sequence-templates-msg" class="msg" hidden></p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>步骤数</th>
                <th>来源机台</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sequence-templates-body">
              <tr><td colspan="5" class="empty">暂无序列模板</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="shot-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="shot-modal"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2>截图</h2>
        <button id="shot-close" type="button" class="btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <img id="shot-img" alt="截图">
      </div>
    </div>
  </div>

  <div id="shot-history-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="shot-history-modal"></div>
    <div class="modal-panel modal-panel-wide">
      <div class="modal-header">
        <h2 id="shot-history-title">截图历史</h2>
        <button id="shot-history-close" type="button" class="btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>大小</th>
                <th>查看</th>
              </tr>
            </thead>
            <tbody id="shot-history-body">
              <tr><td colspan="3" class="empty">暂无截图</td></tr>
            </tbody>
          </table>
        </div>
        <div id="shot-history-pager" class="modal-pager" hidden>
          <button id="shot-history-prev" type="button" class="btn-sm">上一页</button>
          <span id="shot-history-page-info"></span>
          <button id="shot-history-next" type="button" class="btn-sm">下一页</button>
        </div>
      </div>
    </div>
  </div>

  <div id="files-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="files-modal"></div>
    <div class="modal-panel modal-panel-wide">
      <div class="modal-header">
        <h2 id="files-title">文件</h2>
        <button id="files-close" type="button" class="btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <nav id="files-crumb" class="files-crumb"></nav>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>名称</th>
                <th>类型</th>
                <th>大小</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="files-body">
              <tr><td colspan="4" class="empty">暂无文件</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="file-preview-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="file-preview-modal"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="file-preview-title">预览</h2>
        <button id="file-preview-close" type="button" class="btn-sm">关闭</button>
      </div>
      <div class="modal-body">
        <pre id="file-preview-pre" hidden></pre>
        <img id="file-preview-img" alt="预览" hidden>
      </div>
    </div>
  </div>

  <script src="/dashboard-runtime.js"></script>
  <script src="/app.js"></script>
</body>
</html>
