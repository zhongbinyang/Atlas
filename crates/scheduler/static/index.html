<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — 测试机台编排</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-block">
        <h1 class="brand">ATLAS</h1>
        <p class="brand-sub">测试机台编排</p>
      </div>
      <nav class="view-tabs" aria-label="主分区">
        <button type="button" id="nav-machines" class="tab active" data-route="machines" aria-current="page">机台</button>
        <button type="button" id="nav-functions" class="tab" data-route="functions">已注册功能</button>
        <button type="button" id="nav-sequences" class="tab" data-route="sequences">序列模板</button>
        <button type="button" id="nav-units" class="tab" data-route="units">单位</button>
      </nav>
    </div>
    <button id="refresh-btn" type="button" class="btn-primary">刷新</button>
  </header>

  <div id="toast" class="toast" role="status" aria-live="polite" tabindex="0" hidden></div>

  <main class="page">
    <div id="view-machines" class="view view-active">
      <section id="agents-section">
        <h2 class="view-title">机台</h2>
        <section id="machine-telemetry" class="machine-control-strip" aria-label="机台遥测控制">
          <div class="machine-summary" aria-label="机台摘要">
            <span>总数 <strong id="agents-total">0</strong></span>
            <span>在线 <strong id="agents-online">0</strong></span>
            <span>忙碌 <strong id="agents-busy">0</strong></span>
            <span>离线 <strong id="agents-offline">0</strong></span>
          </div>
          <div class="machine-refresh-status" aria-live="polite">
            <span id="agents-last-refresh">尚未刷新</span>
            <span id="agents-auto-refresh">自动刷新 · 2 秒</span>
          </div>
          <div class="machine-controls">
            <label for="agent-search">搜索</label>
            <input id="agent-search" type="search" placeholder="名称、IP 或端口" autocomplete="off">
            <label for="agent-status-filter">状态</label>
            <select id="agent-status-filter">
              <option value="all">全部</option>
              <option value="online">在线</option>
              <option value="busy">忙碌</option>
              <option value="offline">离线</option>
            </select>
            <label for="agent-sort">排序</label>
            <select id="agent-sort">
              <option value="name">名称</option>
              <option value="status">状态</option>
              <option value="cpu_desc">CPU</option>
              <option value="memory_desc">内存</option>
            </select>
            <label class="machine-checkbox" for="agent-abnormal-only">
              <input id="agent-abnormal-only" type="checkbox">
              仅异常
            </label>
          </div>
        </section>
        <div id="agents-grid" class="agent-grid" aria-live="polite"></div>
        <p id="agents-empty" class="empty" hidden>暂无机台</p>
      </section>
    </div>

    <div id="view-agent-detail" class="view" hidden>
      <section id="agent-detail-section">
        <div class="detail-toolbar">
          <button type="button" id="agent-detail-back" class="btn-sm">返回机台</button>
          <h2 id="agent-detail-name" class="view-title">—</h2>
        </div>
        <div id="agent-detail-status" class="status-rail"></div>
      </section>
    </div>

    <div id="view-functions" class="view" hidden>
      <section id="vi-templates-section">
        <h2 class="view-title">已注册功能</h2>
        <p id="vi-templates-msg" class="msg" hidden></p>
        <p id="vi-templates-load-msg" class="msg" hidden></p>
        <div class="form-grid vi-agent-row">
          <label for="vi-templates-agent-filter">机台筛选</label>
          <select id="vi-templates-agent-filter">
            <option value="">全部</option>
          </select>
          <label for="vi-templates-source-filter">来源筛选</label>
          <select id="vi-templates-source-filter">
            <option value="">全部</option>
            <option value="labview">VI</option>
            <option value="general">通用</option>
          </select>
        </div>
        <div id="functions-groups" class="functions-groups">
          <section class="function-group" id="functions-vi-group">
            <h3>中心VI功能</h3>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>来源</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>来源机台</th>
                    <th>路径/配置</th>
                    <th>入参</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="vi-templates-body">
                  <tr><td colspan="8" class="empty">暂无已注册 VI 功能</td></tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="function-group" id="functions-general-group">
            <h3>中心通用功能</h3>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>来源</th>
                    <th>名称</th>
                    <th>类型</th>
                    <th>来源机台</th>
                    <th>路径/配置</th>
                    <th>入参</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="general-templates-body">
                  <tr><td colspan="8" class="empty">暂无已注册通用功能</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </section>
    </div>

    <div id="view-sequences" class="view" hidden>
      <section id="sequence-templates-section">
        <h2 class="view-title">序列模板</h2>
        <p id="sequence-templates-msg" class="msg" hidden></p>
        <p id="sequence-templates-load-msg" class="msg" hidden></p>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>名称</th>
                <th>步骤数</th>
                <th>来源机台</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sequence-templates-body">
              <tr><td colspan="5" class="empty">暂无序列模板</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div id="view-units" class="view" hidden>
      <section id="units-section" class="units-panel">
        <div class="units-toolbar">
          <h2 class="view-title">单位</h2>
          <div class="units-toolbar-actions">
            <button type="button" id="units-restore-btn" class="btn-sm">恢复默认</button>
            <button type="button" id="units-add-btn" class="btn-sm">+ 添加</button>
            <button type="button" id="units-save-btn" class="btn-primary">保存</button>
          </div>
        </div>
        <p class="muted-hint">全局共享；所有机台 Spec 单位下拉共用此表。</p>
        <p id="units-msg" class="msg" hidden></p>
        <div class="table-scroll">
          <table class="settings-table">
            <thead>
              <tr>
                <th>单位</th>
                <th>说明</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="units-body">
              <tr><td colspan="3" class="empty">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="confirm-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message" tabindex="-1" hidden>
    <div class="modal-backdrop" data-close="confirm-modal"></div>
    <div class="modal-panel modal-panel-confirm">
      <div class="modal-header">
        <h2 id="confirm-title">确认操作</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
        <div class="modal-actions">
          <button id="confirm-cancel" type="button" class="btn-sm" data-dialog-cancel>取消</button>
          <button id="confirm-confirm" type="button" class="btn-danger" data-dialog-confirm>删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/dashboard-runtime.js"></script>
  <script src="/app.js"></script>
</body>
</html>
